name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Foundation-only packages: same checks as the Linux dev container.
  packages-linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: SetmioCore
        run: swift test --package-path Packages/SetmioCore
      - name: SetmioAI
        run: swift test --package-path Packages/SetmioAI
      - name: SetmioHealth (HealthKit-free parts)
        run: swift test --package-path Packages/SetmioHealth

  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  # Full Apple build: iOS app (embeds the watch app and the widget extension) and the host-app tests.
  apple:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          xcrun simctl list runtimes | grep -E "iOS|watchOS" || true
      - name: Generate project
        run: |
          brew install xcodegen
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          xcodegen generate --spec project.yml
      - name: Build iOS app (with watch app and widgets)
        run: |
          set -o pipefail
          xcodebuild -project Setmio.xcodeproj -scheme Setmio \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee build-ios.log | grep -E "error:|warning: .*Sendable|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-ios.log
      - name: Build watchOS app
        run: |
          set -o pipefail
          xcodebuild -project Setmio.xcodeproj -scheme SetmioWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee build-watch.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-watch.log
      - name: Host-app tests (iOS Simulator)
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['name'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Using simulator: $DEVICE"
          xcodebuild test -project Setmio.xcodeproj -scheme Setmio \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO | tee test-ios.log | grep -E "error:|✘|✔ Test run|Test Suite .* (passed|failed)|TEST (SUCCEEDED|FAILED)" || true
          grep -qE "TEST SUCCEEDED" test-ios.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: "*.log"
          if-no-files-found: ignore
