# Cloudflare Workers 部署描述。密钥用 `wrangler secret put ANTHROPIC_API_KEY` / `INVITE_CODE` 写入，不要放在这里。
name = "setmio-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOW_BACKEND_OVERRIDE = "false"

# 设备令牌哈希与限流计数。`wrangler kv namespace create SETMIO_KV` 后把生成的 id 填到这里。
[[kv_namespaces]]
binding = "SETMIO_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = true
